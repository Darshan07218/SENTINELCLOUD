# =========================================================================
# SentinelCloud — LOCAL overlay (Kind / Minikube). Phase 9.
#
#   kubectl apply -k k8s/overlays/local       # create / update everything
#   kubectl kustomize k8s/overlays/local      # print the fully-rendered YAML
#   kubectl delete -k k8s/overlays/local      # remove everything (incl. data)
#
# Builds on ../../base and adds the two things that differ per
# environment:
#   1. the Secret, generated from secrets.env (gitignored — create it
#      with: cp secrets.env.example secrets.env)
#   2. image names/tags (locally built images, loaded into the cluster)
# A future overlays/cloud would point images at a registry and source
# the Secret from the cloud's secret manager, reusing the same base.
# =========================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sentinelcloud

labels:
  - pairs:
      app.kubernetes.io/part-of: sentinelcloud
    includeSelectors: false

resources:
  - ../../base

secretGenerator:
  # → Secret "sentinelcloud-secrets-<content-hash>". Kustomize rewrites
  # every secretKeyRef in the base to the hashed name, so changing a
  # value and re-applying rolls all dependent pods automatically.
  - name: sentinelcloud-secrets
    envs:
      - secrets.env

# Locally built images (see scripts/k8s-build-images.sh). Single place
# to change tags; imagePullPolicy is IfNotPresent, so a tag that isn't
# loaded into the cluster shows up as ErrImagePull.
images:
  - name: sentinelcloud/gateway
    newTag: "1.0.0"
  - name: sentinelcloud/auth-service
    newTag: "1.0.0"
  - name: sentinelcloud/hospital-service
    newTag: "1.0.0"
  - name: sentinelcloud/ambulance-service
    newTag: "1.0.0"
  - name: sentinelcloud/blood-bank-service
    newTag: "1.0.0"
  - name: sentinelcloud/power-service
    newTag: "1.0.0"
  - name: sentinelcloud/disaster-service
    newTag: "1.0.0"
  - name: sentinelcloud/notification-service
    newTag: "1.0.0"
  - name: sentinelcloud/frontend
    newTag: "1.0.0"
  - name: sentinelcloud/resilience-service
    newTag: "1.0.0"
  - name: sentinelcloud/response-service
    newTag: "1.0.0"
  - name: sentinelcloud/simulator-service
    newTag: "1.0.0"
  - name: sentinelcloud/intake-service
    newTag: "1.0.0"

# Phase 12: the local cluster is served over plain HTTP (http://localhost:30080),
# where a Secure cookie would never be sent back. Only this overlay relaxes it;
# anything served over HTTPS keeps the base value "true".
patches:
  - target:
      kind: ConfigMap
      name: auth-service-config
    patch: |-
      - op: replace
        path: /data/COOKIE_SECURE
        value: "false"
