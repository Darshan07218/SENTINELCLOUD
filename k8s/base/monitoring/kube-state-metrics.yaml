# =========================================================================
# kube-state-metrics (Phase 10) — turns Kubernetes OBJECT STATE into
# metrics: pod phase and readiness, container restarts and waiting
# reasons (CrashLoopBackOff), last termination reason (OOMKilled),
# deployment/HPA replica counts, and resource requests/limits.
#
# cAdvisor (in the kubelet) says how much CPU/memory a container USES;
# kube-state-metrics says what it's ALLOWED (limits) and whether it's
# healthy. Together: "pod X is at 95% of its memory limit" and "pod Y
# has restarted 4 times".
# =========================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinelcloud-kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
rules:
  # Read-only, and only the object kinds the dashboards/alerts use.
  - apiGroups: [""]
    resources: [pods, nodes, namespaces, services, persistentvolumeclaims]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinelcloud-kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentinelcloud-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: sentinelcloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/component: monitoring
    spec:
      serviceAccountName: kube-state-metrics
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          imagePullPolicy: IfNotPresent
          args:
            # Only the object kinds we use (matches the RBAC above, keeps
            # the series count — and Prometheus' memory — small)…
            - --resources=pods,nodes,namespaces,services,persistentvolumeclaims,deployments,replicasets,statefulsets,horizontalpodautoscalers
            # …and only SentinelCloud's namespace (nodes are cluster-scoped and unaffected).
            - --namespaces=sentinelcloud
          ports:
            - name: http-metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: http-metrics
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http-metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
