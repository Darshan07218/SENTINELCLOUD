# =========================================================================
# Prometheus (Phase 10) — scrapes every SentinelCloud pod, cAdvisor,
# kube-state-metrics and RabbitMQ; evaluates recording + alert rules;
# sends firing alerts to Alertmanager.
#
# Config and rules come from ConfigMaps generated by
# k8s/base/kustomization.yaml (hash-suffixed, so editing a rule file and
# re-applying rolls Prometheus automatically).
# =========================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
---
# Service discovery reads pods/nodes from the Kubernetes API, and
# cAdvisor metrics are fetched through the API server's node proxy —
# hence read-only, cluster-wide permissions. Nothing here can modify
# the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinelcloud-prometheus
  labels:
    app.kubernetes.io/name: prometheus
rules:
  - apiGroups: [""]
    # Phase 12: no "nodes/proxy" (it can be escalated to command execution
    # through the kubelet). cAdvisor is read via nodes/metrics instead.
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinelcloud-prometheus
  labels:
    app.kubernetes.io/name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentinelcloud-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: sentinelcloud
---
# Metric history survives Prometheus restarts (so a restart mid-demo
# doesn't wipe the graphs). Retention is capped by time AND size below.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  labels:
    app.kubernetes.io/name: prometheus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two Prometheus pods can't share one
  # ReadWriteOnce volume (and two would double-evaluate alerts).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: monitoring
    spec:
      serviceAccountName: prometheus   # its token authenticates discovery + the cAdvisor proxy
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60  # let the TSDB flush cleanly
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534   # "nobody", the image's default user
        runAsGroup: 65534
        fsGroup: 65534     # makes the PVC writable for it
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/config/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=3d
            - --storage.tsdb.retention.size=1500MB   # stay inside the 2Gi PVC
            - --web.enable-lifecycle                 # POST /-/reload re-reads config without a restart
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30   # WAL replay after a restart can take a while
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/config
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
spec:
  # NodePort so the UI is reachable from your machine:
  #   Kind: http://localhost:30090 (k8s/cluster/kind-cluster.yaml maps it)
  #   Any cluster: kubectl port-forward -n sentinelcloud svc/prometheus 9090:9090
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
