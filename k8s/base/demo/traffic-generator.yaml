# =========================================================================
# Demo traffic generator (Phase 10) — for presentations ONLY.
#
# Deployed with replicas: 0, so it does nothing until you start it:
#   kubectl scale deployment traffic-generator -n sentinelcloud --replicas=1   # start (~8 req/s)
#   kubectl scale deployment traffic-generator -n sentinelcloud --replicas=3   # more load
#   kubectl scale deployment traffic-generator -n sentinelcloud --replicas=0   # stop
#
# It logs in through the gateway as the seeded admin (credentials from
# the same Secret auth-service seeds them from), then makes realistic
# read calls across every domain service, also through the gateway:
# hospitals, ambulances, blood banks, power, disasters, recent events,
# plus one deliberately invalid request per round (a steady trickle of
# 4xx). It re-logs in every 5 minutes (tokens last 15). It only READS,
# so it never changes data.
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  labels:
    app.kubernetes.io/name: traffic-generator
    app.kubernetes.io/component: demo
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-generator
        app.kubernetes.io/component: demo
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 2
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic-generator
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: GATEWAY
              value: http://gateway:8080/api/v1
            - name: ROUND_INTERVAL_SECONDS
              value: "1"
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: sentinelcloud-secrets
                  key: DEFAULT_ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinelcloud-secrets
                  key: DEFAULT_ADMIN_PASSWORD
          command: ["/bin/sh", "-c"]
          args:
            - |
              login() {
                wget -qO- --header "Content-Type: application/json" \
                  --post-data "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
                  "$GATEWAY/auth/login" 2>/dev/null | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p'
              }
              while true; do
                TOKEN=$(login)
                if [ -z "$TOKEN" ]; then echo "login failed (gateway/auth not ready?) - retrying in 10s"; sleep 10; continue; fi
                echo "logged in - sending traffic for 5 minutes"
                END=$(( $(date +%s) + 300 ))
                ROUNDS=0
                while [ "$(date +%s)" -lt "$END" ]; do
                  for P in hospitals/ ambulances/ blood-banks/ power/ disasters/ hospitals/stats/summary "notifications/events/recent?limit=20" hospitals/not-a-real-id; do
                    wget -q -O /dev/null --header "Authorization: Bearer $TOKEN" "$GATEWAY/$P" 2>/dev/null &
                  done
                  wait
                  ROUNDS=$((ROUNDS + 1))
                  [ $((ROUNDS % 60)) -eq 0 ] && echo "$ROUNDS rounds sent"
                  sleep "$ROUND_INTERVAL_SECONDS"
                done
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
