# =========================================================================
# Notification / realtime service — consumes every bus event, keeps history in Redis, and
# pushes live events to dashboards over /ws/live. Safe to run with several replicas since
# Phase 9: each pod has its own live-broadcast queue (see src/index.js).
#
# Objects: ConfigMap (non-secret settings) → Deployment → ClusterIP
# Service (stable internal DNS name "notification-service") → HorizontalPodAutoscaler.
# =========================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  labels:
    app.kubernetes.io/name: notification-service
data:
  PORT: "8087"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: backend
spec:
  # spec.replicas is intentionally NOT set: the HorizontalPodAutoscaler
  # below owns the replica count. If it were set here, every
  # `kubectl apply -k k8s/overlays/local` would reset the count and fight the HPA.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # start one new pod before…
      maxUnavailable: 0  # …taking any old pod away → zero-downtime rollouts
  template:
    metadata:
      annotations:
        # Phase 10: opt in to Prometheus scraping (see the sentinelcloud-pods
        # job in k8s/base/monitoring/config/prometheus/prometheus.yml).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8087"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false # the app never talks to the Kubernetes API
      # Don't inject Docker-link-style env vars (GATEWAY_PORT=tcp://…,
      # REDIS_PORT=tcp://… etc.) for every Service in the namespace — they
      # can silently collide with real settings like REDIS_PORT/RABBITMQ_PORT.
      # Services are found via DNS instead.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes when there is more than one node;
      # a no-op on single-node Minikube/Kind (ScheduleAnyway never blocks).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: notification-service
      containers:
        - name: notification-service
          image: sentinelcloud/notification-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8087
          envFrom:
            - configMapRef:
                name: sentinelcloud-common
            - configMapRef:
                name: notification-service-config
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: sentinelcloud-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinelcloud-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)"
            # Phase 12: verifies access tokens on /events/recent and the
            # /ws/live handshake itself, and authenticates to Redis.
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: sentinelcloud-secrets
                  key: JWT_ACCESS_SECRET
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinelcloud-secrets
                  key: REDIS_PASSWORD
          # Startup probe: /health only answers once the HTTP server is listening,
          # which happens AFTER migrations + seeding (and after waiting for the
          # migration lock if another replica holds it). Allows up to 2.5 min.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # Liveness: process is alive and its event loop responds. No
          # dependency checks — a Postgres/RabbitMQ outage must NOT restart pods.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: /health/ready requires Redis AND RabbitMQ.
          # Failing readiness removes the pod from the Service's endpoints
          # (no traffic) without restarting it.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Graceful termination: when a pod is deleted, the kubelet runs
          # preStop and, in parallel, the control plane removes the pod from
          # the Service's endpoints. Sleeping first gives kube-proxy time to
          # stop routing NEW requests here before the app receives SIGTERM
          # and drains in-flight ones.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:            # what the scheduler reserves; HPA % is relative to this
              cpu: 100m
              memory: 128Mi
            limits:              # hard ceiling: CPU is throttled, memory over-use is OOM-killed
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Writable scratch space, since the root filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: backend
spec:
  # ClusterIP = reachable only inside the cluster, at notification-service:8087 (or
  # notification-service.sentinelcloud.svc.cluster.local). kube-proxy load-balances each new
  # connection across every READY pod matching the selector.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - name: http
      port: 8087
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: 1
  maxReplicas: 3
  # Utilization is measured against the container's resource REQUEST
  # (not its limit) — e.g. 70% of a 100m request = 70m average CPU.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # react to load spikes immediately
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30 # add at most 2 pods every 30s
    scaleDown:
      stabilizationWindowSeconds: 120 # wait 2 min of low load before removing pods
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60 # remove at most 1 pod per minute
