# Phase 12: browser security headers for the SentinelCloud UI.
# Included in every location that serves the app itself (nginx's
# add_header is NOT inherited into a location that has its own add_header,
# so each such location includes this file). API responses get the
# equivalent headers from the gateway's helmet().
#
# CSP: only this origin may supply scripts, styles, images, fonts and
# connections (fetch + the same-origin WebSocket). No inline scripts or
# styles, no plugins, no framing (clickjacking on the admin buttons), no
# <base> or form hijacking. React's style={{…}} props are applied through
# the DOM (CSSOM), which CSP doesn't block.
# img-src also allows the basemap tile hosts used by the live maps
# (components/LiveMap.jsx: CARTO streets/night, Esri satellite) — map tiles
# are plain images, nothing executable.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.basemaps.cartocdn.com https://server.arcgisonline.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Served over HTTPS? Add HSTS here too:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
